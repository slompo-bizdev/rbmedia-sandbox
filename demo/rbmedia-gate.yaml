scenes:
  - say: "This is a real Shopify store — ten audiobook titles across three invented imprints, seeded through the Admin API this morning. Each one carries its I S B N, its imprint, the territories it is allowed to sell in, and the audio file delivered after checkout. The catalogue is synthetic and the imprints are made up, because I did not want to put a real brand on my sandbox. The store is not."
    caption: "A real Shopify store, seeded through the Admin API"
    actions:
      - goto: "file:///Users/victorslompo/projects/rbmedia-sandbox/demo/store.html"
      - wait: 5500

  - say: "Selling audiobooks direct is not a storefront problem. Rights are licensed per territory and per window, so a title that is buyable where the licence does not reach is not a user-experience bug — it is a breach with the rights holder. So the interesting object is the gate in front of the shop, and today it says no-go. Four of eighteen readiness checks met, and four blocking problems in the catalogue worth about twenty-four thousand dollars a month."
    caption: "NO-GO · 4 of 18 ready · $23,815/mo at risk"
    actions:
      - goto: "file:///Users/victorslompo/projects/rbmedia-sandbox/run.html"
      - wait: 4000

  - say: "Six rules, reading the live store through the Admin API and reconciling it against the rights table. Saltmarsh is on sale in the United Kingdom on a licence that ended in June. Winter Ledger is live three weeks before its window opens. Driftwood Hour is buyable with no audio file attached, so the order cannot be fulfilled. Ranked blocking first, then by money, because that is the order an operations team should work it."
    caption: "Six rules · rights, windows, price floors, duplicates, deliverables"
    actions:
      - goto: "file:///Users/victorslompo/projects/rbmedia-sandbox/run.html#findings"
      - wait: 4000
      - scroll: { by: 340 }
      - wait: 3000

  - say: "Launch readiness is the job description\'s own list — infrastructure, security, load, observability, checkout — as a table rather than a document. Two decisions worth defending. An unanswered check counts as not ready, because scoring it as a pass is how a launch date slips quietly. And the rows marked as gates are not human judgements: they resolve from the catalogue findings on every run, so the two halves stay reconciled instead of becoming two reports nobody compares."
    caption: "Readiness as data · unanswered counts as not ready"
    actions:
      - goto: "file:///Users/victorslompo/projects/rbmedia-sandbox/run.html#readiness"
      - wait: 4000
      - scroll: { by: 420 }
      - wait: 3000

  - say: "And this is not observability. There is no telemetry here — no metrics, no traces, no error budget, nobody holding a pager. It is a monitor over business invariants. Most teams instrument the infrastructure and leave the business rules uninstrumented, which is how a system fails while every dashboard stays green. What observability would actually need is named here, and none of it is built. Saying what is missing is worth more than claiming the ground."
    caption: "Not observability — a monitor over business invariants"
    actions:
      - goto: "file:///Users/victorslompo/projects/rbmedia-sandbox/run.html#notobs"
      - wait: 4500
      - scroll: { by: 360 }
      - wait: 3000

  - say: "Stakeholder demands arrive as email. A human reads the prose and fills in a small structured form — that is judgement, and judgement does not belong inside a deterministic rule. The gate then decides. Three demands here, three different answers. One does not survive the rights table, so the reply carries evidence instead of an opinion. One falls on a contract line with no approved hours, so it is a change request on the day it arrives, not a task somebody forgot. And one is already on the board, so it gets linked rather than opened twice."
    caption: "Not reproducible · change request · already tracked"
    actions:
      - goto: "file:///Users/victorslompo/projects/rbmedia-sandbox/run.html#intake"
      - wait: 4000
      - scroll: { by: 500 }
      - wait: 4000

  - say: "Every finding becomes an issue somebody owns, labelled by rule and by the vendor the contract puts it on. The sync is idempotent, so running it each morning updates the board instead of flooding it, and there is no state file — the issue is the state. Past its owner\'s service level it goes to urgent, and the brief says so in the channel where the team already works. That is the whole idea: find what fails without anyone noticing, give it an owner and a clock, and put it where people already are."
    caption: "One owned ticket per problem · aged against SLA"
    actions:
      - goto: "https://linear.app/rbmedia-sandbox/team/RBM/all"
      - wait: 5000
      - scroll: { by: 260 }
