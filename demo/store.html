<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The storefront</title>
<style>
  :root{--bg:#0E1113;--card:#15191C;--line:#242A2F;--ink:#EDF1F3;--mute:#6E7A83;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--mute);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:36px 28px}
  .wrap{max-width:1180px;width:100%}
  h1{font-size:13px;font-weight:600;color:var(--ink);text-transform:uppercase;
  letter-spacing:.1em;font-family:var(--mono);margin:0 0 4px}
  p.sub{font-family:var(--mono);font-size:12px;color:var(--mute);margin:0 0 16px}
  figure{margin:0;background:var(--card);border:1px solid var(--line);padding:10px}
  img{display:block;width:100%;height:auto}
  .missing{font-family:var(--mono);font-size:13px;line-height:1.8;color:var(--mute);
  background:var(--card);border:1px dashed var(--line);padding:28px}
  .missing b{color:var(--ink)} code{color:#7DD3FC}
</style>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    document.getElementById('shot').addEventListener('error', function () {
      document.getElementById('fig').style.display = 'none';
      document.getElementById('miss').style.display = 'block';
    });
  });
</script>
</head><body><div class="wrap">
  <h1>slompoboutique.myshopify.com</h1>
  <p class="sub">Nine live listings, three imprints, seeded through the Admin API — metafields carry ISBN, imprint, territories and the deliverable</p>
  <figure id="fig"><img id="shot" src="store.png" alt="The seeded audiobook storefront"></figure>
  <div class="missing" id="miss" style="display:none">
    <b>store.png is not here yet.</b><br>
    Screenshot <code>slompoboutique.myshopify.com/collections/all</code> and save it
    as <code>demo/store.png</code> next to this file.
  </div>
</div></body></html>
